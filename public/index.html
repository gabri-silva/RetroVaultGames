<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RetroVaultPS2 — Catálogo de jogos</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="catalog-client">
    <header class="site-header container">
      <a href="/" class="brand" aria-label="RetroVaultPS2, catálogo de jogos">
        <span class="brand-icon" aria-hidden="true">▦</span>RETRO<span
          >VAULTPS2</span
        >
      </a>
      <nav aria-label="Navegação do catálogo">
        <label class="theme-control" for="theme-select">
          <span>Tema</span>
          <select
            id="theme-select"
            class="form-select"
            aria-label="Escolher tema"
          >
            <option value="classic">Clássico</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="metallic-blue">Metalic Blue</option>
          </select>
        </label>
        <button
          id="chat-toggle"
          class="nav-btn"
          aria-expanded="false"
          aria-controls="chat-panel"
        >
          Chat
        </button>
        <button id="favorites" class="nav-btn" aria-pressed="false">
          ♡ Favoritos <span id="fav-count">0</span>
        </button>
      </nav>
    </header>
    <main>
      <section
        id="catalog"
        class="catalog container"
        aria-label="Catálogo de jogos"
      >
        <h1 class="visually-hidden">Catálogo de jogos</h1>
        <div class="catalog-toolbar">
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="Buscar jogos…"
              aria-label="Buscar jogos por nome, console ou gênero"
            />
          </label>
          <select
            id="genre"
            class="form-select"
            aria-label="Filtrar por gênero"
          >
            <option value="">Todos os gêneros</option>
          </select>
          <select id="sort" class="form-select" aria-label="Ordenar jogos">
            <option value="recent">Mais recentes</option>
            <option value="title">Nome: A–Z</option>
            <option value="year">Ano de lançamento</option>
          </select>
        </div>
        <div class="console-filters">
          <div
            id="platform-list"
            role="group"
            aria-label="Filtrar por console"
          ></div>
          <button id="clear-filters" class="clear-btn">Limpar filtros</button>
        </div>
        <div id="catalog-notice" class="notice" role="status" hidden></div>
        <div class="result-head">
          <span id="result-label" role="status">Carregando jogos…</span>
          <span id="total-count"></span>
        </div>
        <div id="game-grid" class="game-grid" aria-live="polite"></div>
        <div id="pagination" class="pagination-bar"></div>
      </section>
    </main>
    <footer class="container catalog-footer">
      <span>RetroVaultPS2</span>
      <p>development Gabriel A. Silva - Dev</p>
    </footer>
    <dialog id="game-dialog">
      <button
        id="close-dialog"
        class="dialog-close"
        aria-label="Fechar detalhes"
      >
        ×
      </button>
      <div id="game-details"></div>
    </dialog>

    <section
      id="chat-panel"
      class="chat-panel"
      aria-labelledby="chat-title"
      hidden
    >
      <div class="chat-heading">
        <div>
          <h2 id="chat-title">Chat retrô</h2>
          <small>Somente texto · sem links · sem palavrões</small>
        </div>
        <button id="chat-close" type="button" aria-label="Fechar chat">
          ×
        </button>
      </div>
      <div id="chat-notice" class="notice" role="alert" hidden></div>
      <form id="chat-join">
        <label for="chat-nick" class="form-label">Como quer ser chamado?</label
        ><input
          id="chat-nick"
          class="form-control"
          required
          minlength="3"
          maxlength="20"
          autocomplete="off"
          placeholder="Seu nick"
        />
        <p class="muted">
          Não precisa de cadastro. Escolha um nick de 3 a 20 caracteres.
        </p>
        <button id="chat-enter" class="btn btn-orange w-100">
          ENTRAR NO CHAT →
        </button>
      </form>
      <div id="chat-room" hidden>
        <div class="chat-identity">
          <span>Você: <strong id="chat-user"></strong></span
          ><button id="chat-leave" type="button" class="clear-btn">Sair</button>
        </div>
        <div
          id="chat-messages"
          class="chat-messages"
          role="log"
          aria-live="polite"
          aria-label="Mensagens do chat"
          tabindex="0"
        ></div>
        <form id="chat-compose">
          <label for="chat-text" class="visually-hidden">Sua mensagem</label
          ><textarea
            id="chat-text"
            class="form-control"
            rows="3"
            maxlength="500"
            required
            placeholder="Conte algo sobre seus jogos favoritos…"
          ></textarea>
          <div class="chat-compose-footer">
            <small id="chat-counter">0/500 · mínimo 25</small
            ><button id="chat-send" class="btn btn-orange" disabled>
              ENVIAR →
            </button>
          </div>
        </form>
        <small class="chat-history-note"
          >Últimas 60 mensagens das últimas 24 horas.</small
        >
      </div>
    </section>
    <script src="js/common.js"></script>
    <script src="js/client.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
